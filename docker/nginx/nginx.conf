# ============================================================================
# Aperture — production Nginx reverse proxy
# Terminates TLS, serves the Next.js frontend, proxies /api to the NestJS backend,
# and adds caching + security headers + gzip. Place behind a CDN for images.
# ============================================================================

worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 30m;            # photo uploads (matches backend 25MB cap + headroom)

  # gzip (CDN/edge typically also compresses)
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  # Upstreams (PM2 / containers)
  upstream aperture_backend  { server 127.0.0.1:4000; keepalive 32; }
  upstream aperture_frontend { server 127.0.0.1:3000; keepalive 32; }

  # Rate-limit the API at the edge (backend also throttles).
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

  # Redirect HTTP → HTTPS
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name aperture.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    # Security headers (Helmet also sets these app-side)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- API → backend ----
    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://aperture_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
    }

    # ---- SSE notification stream: disable buffering for realtime ----
    location /api/v1/notifications/stream {
      proxy_pass http://aperture_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
    }

    # ---- Next.js static assets: long cache ----
    location /_next/static/ {
      proxy_pass http://aperture_frontend;
      proxy_cache_valid 200 60m;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ---- Everything else → frontend (SSR/streaming) ----
    location / {
      proxy_pass http://aperture_frontend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
