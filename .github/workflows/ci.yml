name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: photography
          POSTGRES_PASSWORD: photography
          POSTGRES_DB: photography
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U photography"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_HOST: localhost
      DATABASE_PORT: '5432'
      DATABASE_USER: photography
      DATABASE_PASSWORD: photography
      DATABASE_NAME: photography
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      # Test placeholders (≥32 chars where validated).
      JWT_ACCESS_SECRET: ci_access_secret_min_32_chars_long_xx
      JWT_REFRESH_SECRET: ci_refresh_secret_min_32_chars_long_x
      MAIL_FROM_ADDRESS: ci@photography.local

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @photography/types --filter @photography/utils --filter @photography/ui build

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm -r lint

      - name: Typecheck (backend)
        run: pnpm --filter @photography/backend exec tsc --noEmit

      - name: Typecheck (frontend)
        run: pnpm --filter @photography/frontend exec tsc --noEmit

      - name: Unit tests
        run: pnpm -r test

      - name: Build backend
        run: pnpm --filter @photography/backend build

      - name: Migration check (run against ephemeral Postgres)
        run: pnpm --filter @photography/backend migration:run

      - name: Build frontend
        run: pnpm --filter @photography/frontend build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
